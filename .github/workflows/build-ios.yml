name: Build iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure script is executable
        run: chmod +x scripts/build-ios.sh

      - name: Run build script (verbose)
        run: scripts/build-ios.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcontainer-ipa
          path: HTMLContainer.ipa

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: HTMLContainer.ipa
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          draft: false
          prerelease: true
