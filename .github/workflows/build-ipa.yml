name: Build IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ldid
        run: brew install ldid

      - name: Read version from CHANGELOG.md
        id: version
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found in the repo root"
            exit 1
          fi

          VERSION="$(head -n 1 CHANGELOG.md | tr -d '\r' | sed -E 's/^#+[[:space:]]*//; s/[[:space:]]+$//; s/^v//')"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The first line of CHANGELOG.md must be a version like 1.2.3"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build HTMLOpener.ipa
        run: bash scripts/build.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTMLOpener-ipa
          path: build/HTMLOpener.ipa
          if-no-files-found: error

      - name: Build release notes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          tail -n +2 CHANGELOG.md > build/release-notes.md

      - name: Create and push tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: build/release-notes.md
          files: build/HTMLOpener.ipa
